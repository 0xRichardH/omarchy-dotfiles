onboarding = false

[theme]
name = "gruvbox"

auto_switch = false
[keys]
prefix = "ctrl+s"
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"
previous_tab = "ctrl+h"
next_tab = "ctrl+l"
swap_pane_right = ""
cycle_pane_next = "prefix+tab"
focus_pane_down = ""
focus_pane_right = ""
copy_mode = "prefix+["
rename_tab = "prefix+,"
goto = "prefix+o"

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"

[[keys.command]]
key = "prefix+L"
type = "plugin_action"
command = "third774.last-workspace.toggle"
description = "last workspace"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_scope = "all"
[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[experimental]
kitty_graphics = true
