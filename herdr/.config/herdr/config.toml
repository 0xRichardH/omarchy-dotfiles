onboarding = false

[theme]
name = "terminal"

[keys]
prefix = "ctrl+s"
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"
previous_tab = "ctrl+h"
next_tab = "ctrl+l"
swap_pane_right = ""
cycle_pane_next = "prefix+tab"
focus_pane_down = ""
focus_pane_right = ""
copy_mode = "prefix+["
rename_tab = "prefix+,"
toggle_sidebar = "prefix+b"

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"

[[keys.command]]
key = "prefix+L"
type = "plugin_action"
command = "third774.last-workspace.toggle"
description = "last workspace"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "open sesh picker"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
prompt_new_tab_name = false

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["tab", "machine"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch"],
]

[experimental]
kitty_graphics = true

