[settings]
minimum_release_age = "0h"
npm.bun = true
idiomatic_version_file_enable_tools = ["ruby"]

[settings.ruby]
compile = false

[settings.upgrade]

[tools]
bun = "latest"
deno = "latest"
go = "latest"
node = "lts"
python = "latest"
ruby = "latest"
zig = "latest"
zls = "latest"
atuin = "latest"
"npm:opencode-ai" = "latest"
"npm:@anthropic-ai/claude-code" = "latest"
"npm:critique" = "latest" # https://github.com/remorses/critique
"npm:acpx" = "latest"
"npm:hunkdiff" = "latest"
"pipx:pgcli" = { version = "latest", extras = "sshtunnel", uvx_args = "--with 'paramiko<4'" }
"cargo:jj-cli" = "latest"
"npm:mcporter" = "latest"
"npm:agent-browser" = "latest"
"github:ogulcancelik/herdr" = "latest"
"go:github.com/Gentleman-Programming/engram/v2/cmd/engram" = "latest"
cmake = "latest"
duckdb = "latest"
"npm:@moonshot-ai/kimi-code" = "latest"
"npm:@deepseek-ai/dsh" = "latest"
awscli = { version = "latest", symlink_bins = "true" }
"go:github.com/openclaw/gogcli/cmd/gog" = "latest"
grok = { version = "latest", lazy = true, auto_update = "4h", minimum_release_age = "0s" }
