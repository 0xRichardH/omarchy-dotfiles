general.import = [ "~/.local/state/omarchy/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "Google Sans Code" }
bold = { family = "Google Sans Code" }
italic = { family = "Google Sans Code" }
size = 12

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" }
]

# Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
{ key = "Return", mods = "Shift", chars = "\u001B[13;2u" }
