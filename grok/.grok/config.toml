[cli]
installer = "internal"

[marketplace]
official_marketplace_auto_installed = true
default_skills_installs_purged = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-build"
yolo = true
compact_mode = false
permission_mode = "always-approve"
theme = "auto"
screen_mode = "fullscreen"
show_timeline = true
tool_call_density = "detailed"

[consent.answers.enterprise-tos-2026-08]
version = 1
account = "richard@feedmob.com"
acked = true

[mcp_servers.notion]
url = "http://127.0.0.1:3425/mcp/notion"
enabled = true

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.chrome-devtools]
command = "npx"
args = [
    "-y",
    "chrome-devtools-mcp@latest",
]

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"

[mcp_servers.magpie-image]
command = "/usr/bin/magpie"
args = [
    "mcp",
    "image",
]

[plugins]
enabled = [
    "chrome-devtools",
    "pstack",
]

[features]
campaigns = false

[models]
default = "magpie/auto/grok-4.7@500k"
default_reasoning_effort = "medium"

[model."magpie/auto/minimax-m3"]
model = "auto/minimax-m3"
name = "MiniMax-M3 · routing group"
base_url = "http://127.0.0.1:3425/v1"
api_key = "magpie"
api_backend = "chat_completions"
context_window = 1048576

